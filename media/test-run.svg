</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs><rect width="760" height="679" fill="var(--surface)"/><rect x="8" y="8" width="744" height="663" rx="10" class="panel"/><circle cx="28" cy="28" r="5" fill="var(--s2)"/><circle cx="46" cy="28" r="5" fill="var(--muted)"/><circle cx="64" cy="28" r="5" fill="var(--s1)"/><text x="380.0" y="32.0" font-size="12" text-anchor="middle" class="t3">showcase tests</text><text x="24.0" y="56.0" font-size="13" text-anchor="start" class="mono">$ ./scripts/test.sh</text><text x="24" y="81" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">first allowance</tspan></text><text x="24" y="98" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">same frame cannot replenish allowance</tspan></text><text x="24" y="115" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">next frame replenishes</tspan></text><text x="24" y="132" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">starts active</tspan></text><text x="24" y="149" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">cancellation recorded</tspan></text><text x="24" y="166" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 0 x must not alias</tspan></text><text x="24" y="183" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 0 y must not alias</tspan></text><text x="24" y="200" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 1 x must not alias</tspan></text><text x="24" y="217" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 1 y must not alias</tspan></text><text x="24" y="234" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 2 x must not alias</tspan></text><text x="24" y="251" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 2 y must not alias</tspan></text><text x="24" y="268" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 3 x must not alias</tspan></text><text x="24" y="285" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one ULP on corner 3 y must not alias</tspan></text><text x="24" y="302" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">first admitted</tspan></text><text x="24" y="319" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">second admitted</tspan></text><text x="24" y="336" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">count/bytes stay bounded</tspan></text><text x="24" y="353" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">completion is on main</tspan></text><text x="24" y="370" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">completion is on main</tspan></text><text x="24" y="387" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">bounded asynchronous completion</tspan></text><text x="24" y="404" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">FIFO and released budget</tspan></text><text x="24" y="421" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">already decoded stale callback suppressed</tspan></text><text x="24" y="438" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">bounded asynchronous completion</tspan></text><text x="24" y="455" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">index holds every rebuilt unit</tspan></text><text x="24" y="472" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">indexed nearest, range, minimum, furthest and visit order match brute force over 2800 queries</tspan></text><text x="24" y="489" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">equal distances keep the first unit in array order</tspan></text><text x="24" y="506" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">the buffer defaults to 150 ms and rejects out-of-range values</tspan></text><text x="24" y="523" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">presentation time never rewinds under jitter</tspan></text><text x="24" y="540" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">steady delivery presents about one buffer delay behind</tspan></text><text x="24" y="557" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">a one-second outage cannot run presentation past the newest snapshot plus 150 ms</tspan></text><text x="24" y="574" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">recovery rebases forward instead of slowly replaying stale state</tspan></text><text x="24" y="591" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">one second at 120 Hz publishes 20 snapshots</tspan></text><text x="24" y="608" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">a 300 ms hitch publishes once instead of replaying missed snapshots</tspan></text><text x="24" y="625" font-size="12" class="mono"><tspan fill="var(--s1)">ok</tspan><tspan class="t2" dx="10">forced publication bypasses the cadence</tspan></text><text x="24.0" y="642.0" font-size="13" text-anchor="start" class="mono" font-weight="600">PASS 33 showcase correctness checks</text></svg>
