<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 679" width="760" height="679" role="img" aria-labelledby="t d"><title id="t">Showcase test run</title><desc id="d">33 checks print ok, ending with: PASS 33 showcase correctness checks</desc><style>
  svg { --surface:#ffffff; --ink:#1f2328; --ink-2:#59636e; --muted:#818b98; --grid:#e6e8eb; --panel:#f6f8fa; --edge:#d1d9e0;
        --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#0d1117; --ink:#f0f6fc; --ink-2:#9198a1; --muted:#6e7681; --grid:#262c36; --panel:#151b23; --edge:#3d444d;
          --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
