<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d"><title id="t">How the guest draws the host’s battle</title><desc id="d">The host simulates and sends 20 Hz snapshots; the guest sends inputs back and predicts its own hero. The guest draws 150 ms behind the newest snapshot, so a late gap of up to about 150 ms still has two snapshots to interpolate between.</desc><style>
  svg { --surface:#ffffff; --ink:#1f2328; --ink-2:#59636e; --muted:#818b98; --grid:#e6e8eb; --panel:#f6f8fa; --edge:#d1d9e0;
        --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#0d1117; --ink:#f0f6fc; --ink-2:#9198a1; --muted:#6e7681; --grid:#262c36; --panel:#151b23; --edge:#3d444d;
          --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t2 { fill: var(--ink-2); } .t3 { fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--edge); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); }
  .arrow { stroke: var(--ink-2); stroke-width: 1.5; fill: none; marker-end: url(#head); }
</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs><rect width="760" height="470" fill="var(--surface)"/><text x="16.0" y="28.0" font-size="17" text-anchor="start" font-weight="600">How the guest draws the host’s battle</text><text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t2">Local TCP, authoritative host. The guest predicts only its own hero.</text><rect x="16" y="72" width="220" height="116" rx="8" class="panel"/><rect x="16" y="72" width="4" height="116" rx="2" class="s1"/><text x="30.0" y="94.0" font-size="13" text-anchor="start" font-weight="600">Host</text><text x="30.0" y="112.0" font-size="12" text-anchor="start" class="t2">Simulates every unit</text><text x="30.0" y="128.0" font-size="12" text-anchor="start" class="t2">at the display rate</text><text x="30.0" y="144.0" font-size="12" text-anchor="start" class="t2">SnapshotCadence: 20 Hz,</text><text x="30.0" y="160.0" font-size="12" text-anchor="start" class="t2">skips missed deadlines</text><rect x="524" y="72" width="220" height="116" rx="8" class="panel"/><rect x="524" y="72" width="4" height="116" rx="2" class="s2"/><text x="538.0" y="94.0" font-size="13" text-anchor="start" font-weight="600">Guest</text><text x="538.0" y="112.0" font-size="12" text-anchor="start" class="t2">Keeps the newest 8</text><text x="538.0" y="128.0" font-size="12" text-anchor="start" class="t2">snapshots</text><text x="538.0" y="144.0" font-size="12" text-anchor="start" class="t2">GuestPresentationClock:</text><text x="538.0" y="160.0" font-size="12" text-anchor="start" class="t2">draws 150 ms behind newest</text><path d="M240,112 H520" class="arrow"/><text x="380.0" y="104.0" font-size="12" text-anchor="middle" class="t2">state snapshot every 50 ms</text><path d="M520,156 H240" class="arrow"/><text x="380.0" y="148.0" font-size="12" text-anchor="middle" class="t2">guest movement and commands</text><text x="380.0" y="178.0" font-size="11" text-anchor="middle" class="t3">guest’s own hero moves at once (predicted)</text><text x="16.0" y="222.0" font-size="14" text-anchor="start" font-weight="600">Guest timeline: why a buffer absorbs late snapshots</text><line x1="40" y1="296" x2="720" y2="296" class="axis"/><text x="40.0" y="316.0" font-size="11" text-anchor="middle" class="t3">0 ms</text><text x="153.3" y="316.0" font-size="11" text-anchor="middle" class="t3">100 ms</text><text x="266.7" y="316.0" font-size="11" text-anchor="middle" class="t3">200 ms</text><text x="380.0" y="316.0" font-size="11" text-anchor="middle" class="t3">300 ms</text><text x="493.3" y="316.0" font-size="11" text-anchor="middle" class="t3">400 ms</text><text x="606.7" y="316.0" font-size="11" text-anchor="middle" class="t3">500 ms</text><text x="720.0" y="316.0" font-size="11" text-anchor="middle" class="t3">600 ms</text><rect x="37.0" y="276" width="6" height="20" rx="2" class="s1"/><rect x="93.7" y="276" width="6" height="20" rx="2" class="s1"/><rect x="150.3" y="276" width="6" height="20" rx="2" class="s1"/><rect x="207.0" y="276" width="6" height="20" rx="2" class="s1"/><rect x="411.0" y="276" width="6" height="20" rx="2" class="s1"/><rect x="433.7" y="276" width="6" height="20" rx="2" class="s1"/><rect x="490.3" y="276" width="6" height="20" rx="2" class="s1"/><rect x="547.0" y="276" width="6" height="20" rx="2" class="s1"/><rect x="603.7" y="276" width="6" height="20" rx="2" class="s1"/><text x="34.0" y="268.0" font-size="11" text-anchor="start" class="t2">snapshot arrivals</text><path d="M216.0,286 H408.0" stroke="var(--s2)" stroke-width="2" stroke-dasharray="4 3"/><text x="312.0" y="268.0" font-size="11" text-anchor="middle">180 ms late gap</text><line x1="357.3" y1="348" x2="250.0" y2="348" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#head)"/><circle cx="244.0" cy="348" r="5" class="s2" stroke="var(--surface)" stroke-width="2"/><text x="367.3" y="352.0" font-size="12" text-anchor="start" class="t2">drawn 100 ms behind: past the last snapshot → hero holds</text><line x1="357.3" y1="394" x2="193.3" y2="394" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#head)"/><circle cx="187.3" cy="394" r="5" class="s1" stroke="var(--surface)" stroke-width="2"/><text x="367.3" y="398.0" font-size="12" text-anchor="start" class="t2">drawn 150 ms behind: still between two snapshots → smooth</text><line x1="357.3" y1="272" x2="357.3" y2="300" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3"/><line x1="357.3" y1="326" x2="357.3" y2="406" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3"/><text x="357.3" y="422.0" font-size="11" text-anchor="middle">now = 280 ms</text><text x="16.0" y="458.0" font-size="11" text-anchor="start" class="t3">Illustrative timeline. Device captures logged 57–245 gaps over 100 ms per run (see the gap chart).</text></svg>
