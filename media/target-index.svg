<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">CombatTargetIndex nearest search</title><desc id="d">Units are bucketed into fixed-width bins per team. A nearest query starts at the origin bin and visits neighbouring occupied bins in order of distance, stopping when the next bin is farther than the best match found.</desc><style>
  svg { --surface:#ffffff; --ink:#1f2328; --ink-2:#59636e; --muted:#818b98; --grid:#e6e8eb; --panel:#f6f8fa; --edge:#d1d9e0;
        --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#0d1117; --ink:#f0f6fc; --ink-2:#9198a1; --muted:#6e7681; --grid:#262c36; --panel:#151b23; --edge:#3d444d;
          --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t2 { fill: var(--ink-2); } .t3 { fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--edge); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); }
  .arrow { stroke: var(--ink-2); stroke-width: 1.5; fill: none; marker-end: url(#head); }
</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs><rect width="760" height="330" fill="var(--surface)"/><text x="16.0" y="28.0" font-size="17" text-anchor="start" font-weight="600">CombatTargetIndex: nearest target without scanning everyone</text><text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t2">Each team’s units sit in 128-point bins along the lane; only occupied bins are listed, in order.</text><rect x="40" y="96" width="81" height="64" rx="6" class="panel"/><text x="80.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 0</text><circle cx="60" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><circle cx="100" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><rect x="125" y="96" width="81" height="64" rx="6" class="panel"/><text x="165.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 1</text><rect x="210" y="96" width="81" height="64" rx="6" class="panel"/><text x="250.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 2</text><circle cx="240" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><rect x="295" y="96" width="81" height="64" rx="6" class="panel"/><text x="335.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 3</text><circle cx="365" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><rect x="380" y="96" width="81" height="64" rx="6" class="panel"/><text x="420.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 4</text><rect x="465" y="96" width="81" height="64" rx="6" class="panel"/><text x="505.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 5</text><circle cx="480" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><circle cx="520" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><rect x="550" y="96" width="81" height="64" rx="6" class="panel"/><text x="590.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 6</text><rect x="635" y="96" width="81" height="64" rx="6" class="panel"/><text x="675.5" y="178.0" font-size="11" text-anchor="middle" class="t3">bin 7</text><circle cx="675" cy="128" r="7" class="s1" stroke="var(--surface)" stroke-width="2"/><circle cx="365" cy="128" r="11" fill="none" stroke="var(--s2)" stroke-width="2"/><text x="365.0" y="90.0" font-size="11" text-anchor="middle" class="t2">nearest</text><line x1="420" y1="82" x2="420" y2="166" stroke="var(--s2)" stroke-width="2"/><text x="420.0" y="76.0" font-size="12" text-anchor="middle">query origin</text><path d="M420,206 H343.5" class="arrow"/><text x="516.0" y="210.0" font-size="12" text-anchor="start" class="t2">1  bin 3: nearest so far</text><path d="M420,228 H497.5" class="arrow"/><text x="516.0" y="232.0" font-size="12" text-anchor="start" class="t2">2  bin 5: checked, not nearer</text><path d="M420,250 H258.5" class="arrow"/><text x="516.0" y="254.0" font-size="12" text-anchor="start" class="t2">3  bin 2 is farther → stop</text><text x="16.0" y="300.0" font-size="11" text-anchor="start" class="t3">Search walks outward from the origin’s bin, alternating sides by distance, and stops once the next bin cannot beat the best match.</text><text x="16.0" y="318.0" font-size="11" text-anchor="start" class="t3">Ties go to the unit earlier in the caller’s array, so results match a plain linear scan exactly.</text></svg>
